name: WASM CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0

    - name: Configure nix
      run: |
        mkdir -p ~/.config/nix
        echo "extra-substituters = https://cache.iog.io" >> ~/.config/nix/nix.conf
        echo "extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=" >> ~/.config/nix/nix.conf

    - name: Build WASM binary
      run: |
        nix build .#wasm --accept-flake-config
        echo "=== Result ==="
        ls -la result
        TARGET=$(readlink -f result)
        echo "=== Target: $TARGET ==="
        ls -la "$TARGET/"
        # The binary is likely in TARGET/bin/
        if [ -f "$TARGET/bin/cardano-addresses-wasm" ]; then
          cp "$TARGET/bin/cardano-addresses-wasm" inspect-address.wasm
        elif [ -f "$TARGET/cardano-addresses-wasm" ]; then
          cp "$TARGET/cardano-addresses-wasm" inspect-address.wasm
        else
          # Search for it
          BINARY=$(find "$TARGET" -type f -name "*cardano-addresses*" 2>/dev/null | head -1)
          if [ -n "$BINARY" ]; then
            cp "$BINARY" inspect-address.wasm
          else
            echo "ERROR: WASM binary not found in $TARGET"
            exit 1
          fi
        fi
        ls -lh inspect-address.wasm

    - name: Test WASM binary with wasmtime
      run: |
        nix shell --inputs-from . nixpkgs#wasmtime \
          --command bash -c "
            echo '{\"cmd\":\"inspect\",\"address\":\"stake1uyehkck0lajq8gr28t9uxnuvgcqrc6070x3k9r8048z8y5gh6ffgw\"}' | wasmtime inspect-address.wasm
            echo '{\"cmd\":\"derive\",\"mnemonic\":\"message mask aunt wheel ten maze between tomato slow analyst ladder such report capital produce\",\"path\":\"1852H/1815H/0H/0/0\"}' | wasmtime inspect-address.wasm | head -3
          "

    - name: Upload WASM artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: inspect-address-wasm
        path: inspect-address.wasm
        retention-days: 90
